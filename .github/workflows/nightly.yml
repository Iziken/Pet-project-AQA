# Ночной прогон: то, что дорого гонять на каждый PR, но полезно раз в сутки.
# Кросс-браузерная регрессия (Firefox, WebKit) и анти-флак проверка
# booking-спеков с пятикратным повтором.
#
# Защита минут: job-«страж» (guard) перед тестами сравнивает состояние
# с прошлым ночным прогоном — SHA репозитория и хэш билда стенда.
# Если ничего не изменилось, тесты пропускаются. Падение прошлого прогона
# даёт повторный прогон — поломка не должна «пропадать» из-за отсутствия
# новых коммитов. Прогон принудительно включается флагом force.
name: Nightly checks

# Расписание работает только на ветке по умолчанию (main);
# кнопка Run workflow — на любой ветке вручную.
on:
  schedule:
    - cron: "30 3 * * *" # ежедневно в 03:30 UTC — до начала рабочего дня
  workflow_dispatch:
    inputs:
      force:
        description: "Прогнать, даже если ничего не изменилось"
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 0: СТРАЖ — гонять ли вообще
  # =========================================================================
  guard:
    name: Change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.decide.outputs.skip }}

    steps:
      # Хэш стенда строится из билд-идентификатора Next.js в разметке
      # страницы: он меняется только при деплое продукта, а не при каждом
      # добавлении слота участниками.
      - name: Compute stand build hash
        id: stand
        run: |
          HTML=$(curl -sf --max-time 15 "https://aiqa.su/pomidorqa")
          if [ -z "$HTML" ]; then
            # Стенд недоступен: считаем это изменением — ночной прогон
            # упадёт на тестах и Telegram покажет, что со стендом беда.
            echo "hash=stand-unreachable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILD_REF=$(printf '%s' "$HTML" | grep -oE '/_next/static/[A-Za-z0-9_-]+/' | head -1)
          if [ -n "$BUILD_REF" ]; then
            HASH=$(printf '%s' "$BUILD_REF" | shasum -a 256 | cut -d' ' -f1)
          else
            # Запасной путь: хэш всей разметки, если билд-идентификатор
            # не найден (изменилась структура страницы).
            HASH=$(printf '%s' "$HTML" | shasum -a 256 | cut -d' ' -f1)
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      # Кэш с точным ключом «stand-<hash>»: попадание означает, что такой
      # билд стенда уже проверялся ночным прогоном. Промах — деплой,
      # который ещё не проверялся.
      - name: Restore stand state
        id: stand-state
        uses: actions/cache@v4
        with:
          path: nightly-stand-state
          key: stand-${{ steps.stand.outputs.hash }}

      - name: Decide whether to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          STAND_HASH: ${{ steps.stand.outputs.hash }}
        run: |
          set -euo pipefail

          # Последний завершившийся ночной прогон (у текущего ещё нет conclusion).
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion != null)][0] | "\(.head_sha) \(.conclusion)"' || true)

          REPO_SHA="${{ github.sha }}"
          FORCE_FLAG="$FORCE"

          decide() {
            echo "skip=$1" >> "$GITHUB_OUTPUT"
          }

          if [ "$FORCE_FLAG" = "true" ]; then
            echo "Принудительный прогон (force=true)"
            decide "false"
          elif [ -z "$LAST" ]; then
            echo "Первый ночной прогон — запускаем"
            decide "false"
          elif [ "${LAST%% *}" != "$REPO_SHA" ]; then
            echo "В репозитории есть новые коммиты — запускаем"
            decide "false"
          elif [ "${LAST#* }" = "failure" ]; then
            echo "Прошлый ночной прогон упал — повторяем, поломка не должна пропасть"
            decide "false"
          elif [ "${{ steps.stand-state.outputs.cache-hit }}" != "true" ]; then
            echo "Стенд изменился (новый билд) — запускаем"
            decide "false"
          else
            echo "Изменений нет ни в репо, ни на стенде — пропускаем"
            decide "true"
          fi

  # =========================================================================
  # JOB 1: КРОСС-БРАУЗЕРНАЯ РЕГРЕССИЯ (Firefox, WebKit)
  # =========================================================================
  cross-browser:
    name: E2E / ${{ matrix.browser }}
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false # один браузер не отменяет проверку второго
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # На PR гоняется только Chromium (job e2e в playwright.yml);
      # ночью добираем остальные браузеры.
      - name: Run E2E tests
        run: npx playwright test --project=e2e-${{ matrix.browser }}
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  # =========================================================================
  # JOB 2: АНТИ-ФЛАК — booking-сценарии ×5 (самые тяжёлые и самые важные)
  # =========================================================================
  anti-flak:
    name: Booking specs ×5
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      # CI не задаём: retries в этом прогоне обязаны быть выключены —
      # задача именно поймать флак, а не замаскировать его. Один worker
      # бережёт общий стенд от конкуренции за данные. Проект ограничен
      # Chromium: в этой джобе стоит только он, а кросс-браузерность
      # проверяет соседняя matrix-джоба.
      - name: Run booking specs with 5x repeat
        run: npx playwright test tests/e2e/booking-flow.spec.ts tests/e2e/booking-cancel.spec.ts --project=e2e --repeat-each=5 --workers=1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-antiflak-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  # =========================================================================
  # JOB 3: УВЕДОМЛЕНИЕ В TELEGRAM
  # =========================================================================
  notify:
    name: Telegram notification
    needs: [guard, cross-browser, anti-flak]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send Telegram Message
        uses: appleboy/telegram-action@v1.1.1
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ needs.guard.outputs.skip == 'true' && '⏭️ *НОЧНОЙ ПРОГОН ПРОПУЩЕН: изменений нет*' || ((needs.cross-browser.result == 'success' && needs.anti-flak.result == 'success') && '🟢 *НОЧНОЙ ПРОГОН УСПЕШЕН!*' || '🔴 *НОЧНОЙ ПРОГОН: ЕСТЬ ПАДЕНИЯ!*') }}

            *🌙 Что гонялось:* E2E в Firefox и WebKit + booking-сценарии ×5 на флапы
            *📦 Репозиторий:* `${{ github.repository }}`

            *📊 Статус:*
            • Страж: ${{ needs.guard.result == 'success' && '✅ Успешно' || '❌ Ошибка' }}
            • Пропуск по изменениям: ${{ needs.guard.outputs.skip == 'true' && 'да — минуты сэкономлены' || 'нет — тесты гонялись' }}
            • Cross-browser: ${{ needs.cross-browser.result == 'success' && '✅ Успешно' || (needs.cross-browser.result == 'skipped' && '⏭️ Пропущено' || '❌ Падения') }}
            • Анти-флак (×5): ${{ needs.anti-flak.result == 'success' && '✅ Успешно' || (needs.anti-flak.result == 'skipped' && '⏭️ Пропущено' || '❌ Падения') }}

            🚀 [Открыть логи сборки](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
